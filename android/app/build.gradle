plugins { id 'com.android.application' }

def ksFile = System.getenv('RG_KEYSTORE') ? file(System.getenv('RG_KEYSTORE')) : null
def ksPass = System.getenv('RG_KEY_PASS')

android {
    namespace 'com.gara.rajgarludo'
    compileSdk 36

    defaultConfig {
        applicationId 'in.co.gara.rajgarludo'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('RG_VERSION_CODE') ?: '1')
        versionName '2.3.1'
    }

    signingConfigs {
        if (ksFile != null && ksFile.exists() && ksPass) {
            upload {
                storeFile ksFile
                storePassword ksPass
                keyAlias 'rajgar'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('upload') != null) signingConfig signingConfigs.upload
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['woff2'] }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.android.billingclient:billing:8.0.0'
}
